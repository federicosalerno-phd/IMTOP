# Release: push a tag "vX.Y.Z" and this job attaches IMTOP-Setup.zip to a
# GitHub Release. The file name carries no version on purpose, so that
#   https://github.com/<owner>/IMTOP/releases/latest/download/IMTOP-Setup.zip
# is a permanent one-click download that always gives the newest release; the
# README's button points at it. The version is in the release title, in the tag
# and in the folder inside the zip. The zip is `git archive` of that tag, so it
# contains exactly the tracked files: the app, the installer, the tools and the
# R scripts. The clinical images, the SAM checkpoint and dev/ are git-ignored
# and therefore never in it. .github and .gitattributes are export-ignored.
#
#   git tag v2.0.0
#   git push origin v2.0.0
#
# The tag must match APP_VERSION in imtop/config.py; the job refuses otherwise,
# so the About box and the download name can never disagree.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches APP_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' imtop/config.py)"
          echo "tag=$tag  APP_VERSION=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match APP_VERSION \"$ver\" in imtop/config.py. Bump one of them."
            exit 1
          fi

      - name: Build the zip
        run: |
          # The folder inside the zip carries the version, the file name does not.
          git archive --format=zip --prefix="IMTOP-${GITHUB_REF_NAME}/" -o IMTOP-Setup.zip HEAD
          echo "ZIP=IMTOP-Setup.zip" >> "$GITHUB_ENV"

      - name: Check what went in
        run: |
          unzip -l "$ZIP"
          # The user-facing entry points must be there...
          for f in install.cmd installer/install.ps1 installer/quips.txt requirements.txt imtop/__main__.py imtop/ui/index.html; do
            unzip -l "$ZIP" | grep -q "/$f\$" || { echo "::error::$f is missing from the zip"; exit 1; }
          done
          # ...and the things that must never ship must not be.
          if unzip -l "$ZIP" | grep -Eq 'Wound Image Dataset|\.pth$|^.*/dev/'; then
            echo "::error::the zip contains data that must not be released"; exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ## [Download IMTOP for Windows](https://github.com/${{ github.repository }}/releases/latest/download/IMTOP-Setup.zip)

            **Three steps, about three minutes.**

            1. Click the link above. `IMTOP-Setup.zip` goes to your Downloads folder.
            2. Right-click it, choose **Extract All**, and open the folder that appears.
            3. Inside it, double-click **`install.cmd`**, then press **Install**.

            No prerequisites: the installer finds or installs Python 3.11, builds a private environment and puts IMTOP on the Desktop and in the Start Menu.

            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**. Run `install.cmd` from the extracted folder, not from inside the zip window.
